name: PR63 LodePNG cleanup

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[lodepng-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Clean old datatype path and validate LodePNG decoder build
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/pr63_lodepng_cleanup.py

          cc -std=c99 -O2 \
            -DLODEPNG_NO_COMPILE_ENCODER \
            -DLODEPNG_NO_COMPILE_DISK \
            -DLODEPNG_NO_COMPILE_ANCILLARY_CHUNKS \
            -DLODEPNG_NO_COMPILE_ERROR_TEXT \
            -Isrc -c src/lodepng.c -o /tmp/lodepng.o

          ! grep -q 'picture.datatype' src/MintPrintSettings.c
          ! grep -q 'proto/datatypes' src/MintPrintSettings.c
          ! grep -q 'DataTypesBase' src/MintPrintSettings.c
          ! grep -q 'miniamp_memguard' src/lodepng.c
          grep -q 'lodepng_decode32' src/MintPrintSettings.c
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MintPrintSettings.c src/lodepng.c
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit'
            exit 0
          fi
          git commit -m 'Make vendored LodePNG standalone [lodepng-clean]'
          git push origin HEAD:claude/ink-toner-status-panel
