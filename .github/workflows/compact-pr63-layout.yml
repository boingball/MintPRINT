name: Validate compact PR63 source

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  validate-and-fix:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[nul-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Fix escaped C NULs and validate layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/MintPrintSettings.c')
          data = path.read_bytes()
          nul_count = data.count(b'\x00')
          print(f'NUL bytes before fix: {nul_count}')
          if nul_count:
              data = data.replace(b'\x00', b'\\0')
              path.write_bytes(data)

          text = path.read_text(encoding='utf-8')
          checks = {
              'compact window': '        WA_Width, 520,',
              'compact min window': '        WA_MinWidth, 520,',
              'marker left': '#define MP_MARKER_AREA_LEFT     320',
              'marker bottom': '#define MP_MARKER_AREA_BOTTOM   123',
              'two marker columns': '#define MP_MARKER_COLS            2',
              'unit layout': 'ng.ng_LeftEdge = 48;',
              'unit top': 'ng.ng_TopEdge = 4 + topborder;',
              'media top': 'ng.ng_TopEdge = 125 + topborder;',
              'dpi top': 'ng.ng_TopEdge = 168 + topborder;',
              'sides top': 'ng.ng_TopEdge = 185 + topborder;',
              'test print top': 'ng.ng_TopEdge = 215 + topborder;',
              'short marker helper': 'static void mp_marker_short_name',
              'escaped nul': "out[0] = '\\0';",
          }
          missing = [name for name, needle in checks.items() if needle not in text]
          if missing:
              raise SystemExit('Missing compact-layout checks: ' + ', '.join(missing))
          if '\x00' in text:
              raise SystemExit('Source still contains an embedded NUL')
          if 'WA_Width, 660,' in text or '#define MP_MARKER_AREA_LEFT   510' in text:
              raise SystemExit('Wide-layout remnants remain')

          # Keep comments aligned with the compact button rows.
          text = text.replace(
              '// Query button - kept beside the printer address field.',
              '// Query button - shares the Printer Model row in the compact layout.',
              1,
          )
          text = text.replace(
              '// Discover button - sits below Query, searches the LAN for printers.\n'
              '    // Nudged a few px below the shared IPP Path row so its bevel has\n'
              '    // clear space from Query\'s above it, then restored so it doesn\'t\n'
              '    // shift every row below.',
              '// Discover button - shares the Printer IP/Host row in the compact layout.\n'
              '    // Preserve the previous TopEdge afterwards so this isolated button does\n'
              '    // not affect the state used by later gadget setup.',
              1,
          )
          text = text.replace(
              '// LeftEdge is nudged right of the other rows\' shared 130 - this is the\n'
              '    // longest label at this column ("Printer Engine:", 15 chars) and at 130\n'
              '    // it renders with no left margin at all, clipping against the window\n'
              '    // edge.',
              '// Printer Engine has the longest label in the left column; x=132 keeps\n'
              '    // a small left margin while leaving the compact ink panel free at x=320.',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

          if grep -P -n '\x00' src/MintPrintSettings.c; then
            echo 'ERROR: embedded NUL remains in MintPrintSettings.c'
            exit 1
          fi

          git diff --check
          grep -n 'MP_MARKER_AREA_LEFT\|MP_MARKER_AREA_BOTTOM\|WA_Width, 520\|WA_MinWidth, 520' src/MintPrintSettings.c

      - name: Commit source cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MintPrintSettings.c
          git commit -m 'Validate compact marker layout and C escapes [nul-fix-applied]'
          git push origin HEAD:claude/ink-toner-status-panel
