name: Bump FinalWriter test driver revision

on:
  push:
    branches:
      - fix/finalwriter-variable-strip-width
    paths:
      - .github/workflows/bump-finalwriter-driver-rev.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalwriter-variable-strip-width
      - name: Sync driver revision to 41.12
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/#define MP_DRIVER_SUBREV 11/#define MP_DRIVER_SUBREV 12/' driver/driver_core.c
          sed -i 's/The driver revision is \*\*41\.11\*\*/The driver revision is **41.12**/' README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add driver/driver_core.c README.md
            git commit -m 'Bump FinalWriter test driver revision to 41.12'
            git push origin HEAD:fix/finalwriter-variable-strip-width
          fi
