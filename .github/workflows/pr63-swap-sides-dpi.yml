name: PR63 swap Sides and DPI rows

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[sides-dpi-swapped]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Put Sides directly under duplex hint and DPI below
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/MintPrintSettings.c')
          s = p.read_text(encoding='utf-8')

          dpi_old = '''    ng.ng_LeftEdge = 348;\n    ng.ng_Width = 100;\n    ng.ng_Height = 12;\n    ng.ng_TopEdge = 153 + topborder;\n    ng.ng_GadgetText = (STRPTR)"DPI:";\n    ng.ng_GadgetID = GAD_RESOLUTION;'''
          dpi_new = '''    ng.ng_LeftEdge = 348;\n    ng.ng_Width = 100;\n    ng.ng_Height = 12;\n    ng.ng_TopEdge = 171 + topborder;\n    ng.ng_GadgetText = (STRPTR)"DPI:";\n    ng.ng_GadgetID = GAD_RESOLUTION;'''

          sides_old = '''    ng.ng_LeftEdge = 350;\n    ng.ng_Width = 150;\n    ng.ng_Height = 12;\n    ng.ng_TopEdge = 171 + topborder;\n    ng.ng_GadgetText = (STRPTR)"Sides:";\n    ng.ng_GadgetID = GAD_SIDES;'''
          sides_new = '''    ng.ng_LeftEdge = 350;\n    ng.ng_Width = 150;\n    ng.ng_Height = 12;\n    ng.ng_TopEdge = 153 + topborder;\n    ng.ng_GadgetText = (STRPTR)"Sides:";\n    ng.ng_GadgetID = GAD_SIDES;'''

          if dpi_old not in s:
              raise SystemExit('DPI geometry anchor not found')
          if sides_old not in s:
              raise SystemExit('Sides geometry anchor not found')

          s = s.replace(dpi_old, dpi_new, 1)
          s = s.replace(sides_old, sides_new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          grep -A5 'ng.ng_LeftEdge = 348;' src/MintPrintSettings.c | grep -q 'ng.ng_TopEdge = 171 + topborder;'
          grep -A5 'ng.ng_LeftEdge = 350;' src/MintPrintSettings.c | grep -q 'ng.ng_TopEdge = 153 + topborder;'
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c
          git commit -m 'Place Sides below duplex hint and DPI underneath [sides-dpi-swapped]'
          git push origin HEAD:claude/ink-toner-status-panel
