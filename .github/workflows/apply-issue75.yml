name: Apply issue 75 patch

on:
  push:
    branches:
      - fix/issue-75-mdns-endpoint

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue75 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-75-mdns-endpoint
      - name: Apply source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/issue75_patch.py')
          s = p.read_text()
          old = """s = replace_once(s, 'test-ipp-enum test-postscript',
                           'test-ipp-enum test-mdns test-postscript', 'phony mdns')"""
          new = """s = s.replace('test-ipp-enum test-postscript',
                        'test-ipp-enum test-mdns test-postscript', 1)"""
          if old not in s:
              raise SystemExit('could not patch phony anchor')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/issue75_patch.py
      - name: Commit patch
        run: |
          git config user.name "MintPRINT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix mDNS endpoint discovery for older IPP printers [issue75 applied]"
          git push origin HEAD:fix/issue-75-mdns-endpoint
