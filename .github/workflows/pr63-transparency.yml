name: PR63 printer icon transparency

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[printer-icon-transparency]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Apply transparency handling
        run: |
          python3 .github/pr63_transparency_patch.py
          grep -q 'mp_printer_icon_mask_bitmap' src/MintPrintSettings.c
          grep -q 'BltMaskBitMapRastPort(mp_printer_icon_bitmap' src/MintPrintSettings.c
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c
          git commit -m 'Respect transparency in downloaded printer icon [printer-icon-transparency]'
          git push origin HEAD:claude/ink-toner-status-panel
