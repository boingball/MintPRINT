name: Apply release-test UI gating
on:
  push:
    branches: [fix/test-suite-followup]
    paths:
      - '.github/releasetest_patch.py'
      - '.github/workflows/apply-releasetest.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-suite-followup
      - name: Apply release-test gating
        run: python3 .github/releasetest_patch.py
      - name: Commit source changes and remove helper
        run: |
          rm -f .github/releasetest_patch.py .github/workflows/apply-releasetest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hide regression Test Suite from public release builds'
          git push
