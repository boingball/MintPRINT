name: PR63 auto-query saved printer

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[startup-query-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Add automatic startup Query
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/MintPrintSettings.c')
          s = path.read_text(encoding='utf-8')

          marker = '''    /* check_and_offer_driver_install() above can pop an EasyRequest on top
'''
          if marker not in s:
              raise SystemExit('startup repaint marker not found')

          block = '''    /* Refresh live printer state (especially ink/toner levels) on startup
     * when this unit already has a saved endpoint.  Reuse exactly the same
     * Query flow as the button so port fallback, capability updates, cache
     * refresh and marker redraw behaviour stay in one place.  A new/blank
     * install has an empty ip_buffer and deliberately does nothing here. */
    if (ip_buffer[0]) {
        char startup_ip[64];
        int startup_port = -1;
        char *startup_response = malloc(MAX_BUFFER);

        if (!startup_response) {
            printf("Could not allocate startup Query response buffer - skipping live refresh\\n");
        } else {
            if (parse_ip_and_port(ip_buffer, startup_ip,
                                  sizeof(startup_ip), &startup_port)) {
                printf("Refreshing saved printer status on startup: %s\\n", ip_buffer);
                perform_query_flow(window, startup_ip, startup_port,
                                   startup_response);
            } else {
                printf("Saved printer address '%s' is invalid - skipping startup Query\\n",
                       ip_buffer);
            }
            free(startup_response);
        }
    }

'''

          if 'Refreshing saved printer status on startup:' not in s:
              s = s.replace(marker, block + marker, 1)

          path.write_text(s, encoding='utf-8')
          PY

          grep -q 'if (ip_buffer\[0\])' src/MintPrintSettings.c
          grep -q 'perform_query_flow(window, startup_ip, startup_port' src/MintPrintSettings.c
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c
          git commit -m 'Auto-query saved printer on settings startup [startup-query-applied]'
          git push origin HEAD:claude/ink-toner-status-panel
