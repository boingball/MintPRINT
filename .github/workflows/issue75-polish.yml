name: Apply issue 75 discovery polish

on:
  push:
    branches:
      - fix/issue-75-mdns-endpoint
    paths:
      - .github/workflows/issue75-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-75-mdns-endpoint
      - name: Polish mDNS merge and logging
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/MintPrintSettings.c")
          s = path.read_text()
          nl = "\n"

          old = nl.join([
              "        int idx;",
              "        struct MPMdnsEndpoint ep;",
              "",
              "        if (window) {",
          ])
          new = nl.join([
              "        int idx;",
              "        struct MPMdnsEndpoint ep;",
              "        BOOL was_new;",
              "        int old_port;",
              "        char old_path[MP_MDNS_PATH_MAX];",
              "",
              "        if (window) {",
          ])
          if s.count(old) != 1:
              raise SystemExit("declaration anchor count = %d" % s.count(old))
          s = s.replace(old, new, 1)

          old = nl.join([
              "        idx = discovery_find_ip(results, count, ipstr);",
              "",
              "        memset(&ep, 0, sizeof(ep));",
              "        if (idx >= 0) {",
              "            strncpy(ep.instance, results[idx].mdns_instance, sizeof(ep.instance) - 1);",
              "            strncpy(ep.path, results[idx].ipp_path, sizeof(ep.path) - 1);",
              "            ep.port = results[idx].ipp_port;",
              "        }",
          ])
          new = nl.join([
              "        idx = discovery_find_ip(results, count, ipstr);",
              "        was_new = (idx < 0) ? TRUE : FALSE;",
              "        old_port = (idx >= 0) ? results[idx].ipp_port : 0;",
              "        if (idx >= 0) {",
              "            strncpy(old_path, results[idx].ipp_path, sizeof(old_path) - 1);",
              "            old_path[sizeof(old_path) - 1] = '\\0';",
              "        } else {",
              "            old_path[0] = '\\0';",
              "        }",
              "",
              "        memset(&ep, 0, sizeof(ep));",
              "        if (idx >= 0) {",
              "            strncpy(ep.instance, results[idx].mdns_instance, sizeof(ep.instance) - 1);",
              "            strncpy(ep.path, results[idx].ipp_path, sizeof(ep.path) - 1);",
              "            ep.port = results[idx].ipp_port;",
              "        }",
          ])
          if s.count(old) != 1:
              raise SystemExit("state anchor count = %d" % s.count(old))
          s = s.replace(old, new, 1)

          old = nl.join([
              "        if (idx < 0) {",
              "            if (count >= max_results) continue;",
              "            idx = count++;",
              "            memset(&results[idx], 0, sizeof(results[idx]));",
              "            strncpy(results[idx].ip, ipstr, sizeof(results[idx].ip) - 1);",
              "            strcpy(results[idx].ipp_path, \"/ipp/print\");",
              "            results[idx].ipp_port = 631;",
              "        }",
              "",
              "        if (ep.instance[0]) {",
          ])
          new = nl.join([
              "        if (idx < 0) {",
              "            if (count >= max_results) continue;",
              "            idx = count++;",
              "            memset(&results[idx], 0, sizeof(results[idx]));",
              "            strncpy(results[idx].ip, ipstr, sizeof(results[idx].ip) - 1);",
              "        }",
              "",
              "        /* Keep the normal IPP/AirPrint endpoint as a conservative fallback",
              "         * even when this address was inserted by SSDP before mDNS enriched",
              "         * it. SRV/TXT below can still replace either value with what the",
              "         * printer actually advertised. */",
              "        if (!results[idx].ipp_path[0])",
              "            strcpy(results[idx].ipp_path, \"/ipp/print\");",
              "        if (results[idx].ipp_port <= 0)",
              "            results[idx].ipp_port = 631;",
              "",
              "        if (ep.instance[0]) {",
          ])
          if s.count(old) != 1:
              raise SystemExit("fallback anchor count = %d" % s.count(old))
          s = s.replace(old, new, 1)

          old = nl.join([
              "        printf(\"Discovery: found %s\\\\n\", results[idx].label);",
              "        mdns_send_detail_query(sockfd, &dest, &results[idx]);",
          ])
          new = nl.join([
              "        if (was_new) {",
              "            printf(\"Discovery: found %s\\\\n\", results[idx].label);",
              "        } else if (old_port != results[idx].ipp_port ||",
              "                   strcmp(old_path, results[idx].ipp_path) != 0) {",
              "            printf(\"Discovery: mDNS endpoint %s:%d%s\\\\n\",",
              "                   results[idx].ip, results[idx].ipp_port,",
              "                   results[idx].ipp_path);",
              "        }",
              "        mdns_send_detail_query(sockfd, &dest, &results[idx]);",
          ])
          if s.count(old) != 1:
              raise SystemExit("logging anchor count = %d" % s.count(old))
          s = s.replace(old, new, 1)
          path.write_text(s)
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/issue75-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c .github/workflows/issue75-polish.yml
          git commit -m "Polish mDNS discovery merge logging"
          git push origin HEAD:fix/issue-75-mdns-endpoint
