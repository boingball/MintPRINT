name: Apply PR85 follow-up safety fix

on:
  push:
    branches:
      - fix/test-suite-followup
    paths:
      - .github/pr85_followup_safety.py
      - .github/workflows/apply-pr85-followup-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-suite-followup
          fetch-depth: 0
      - name: Apply safe sidecar patch
        run: python3 .github/pr85_followup_safety.py
      - name: Commit source changes and remove helper
        run: |
          rm -f .github/pr85_followup_safety.py .github/workflows/apply-pr85-followup-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate regression IPP sidecars from Settings process"
          git push origin HEAD:fix/test-suite-followup
