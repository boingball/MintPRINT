name: PR63 fix duplex hint palette

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[duplex-palette-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Map duplex IFF pixels to existing Workbench pens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/MintPrintSettings.c')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'struct MPSidesHintPen \\{.*?\\};\\n\\n', '', s, count=1, flags=re.S)

          start = s.find('static LONG mp_sides_hint_pen(')
          end = s.find('static void mp_draw_sides_hint(void)', start)
          if start < 0 or end < 0:
              raise SystemExit('old sides hint pen helper not found')

          helper = '\n'.join([
              'static UBYTE mp_sides_hint_nearest_pen(const ULONG *palette,',
              '                                         int pen_count,',
              '                                         UBYTE r, UBYTE g, UBYTE b) {',
              '    int i;',
              '    int best = 0;',
              '    ULONG best_distance = 0xffffffffUL;',
              '',
              '    for (i = 0; i < pen_count; ++i) {',
              '        LONG pr = (LONG)(palette[i * 3 + 0] >> 24);',
              '        LONG pg = (LONG)(palette[i * 3 + 1] >> 24);',
              '        LONG pb = (LONG)(palette[i * 3 + 2] >> 24);',
              '        LONG dr = (LONG)r - pr;',
              '        LONG dg = (LONG)g - pg;',
              '        LONG db = (LONG)b - pb;',
              '        ULONG distance = (ULONG)(dr * dr + dg * dg + db * db);',
              '',
              '        if (distance < best_distance) {',
              '            best = i;',
              '            best_distance = distance;',
              '            if (distance == 0)',
              '                break;',
              '        }',
              '    }',
              '',
              '    return (UBYTE)best;',
              '}',
              '',
              ''
          ])
          s = s[:start] + helper + s[end:]

          old = '    struct MPSidesHintPen pens[MP_SIDES_HINT_MAX_PENS];\n    struct RastPort *rp;\n    int index;\n    int pen_count = 0;\n    int draw_w, draw_h;\n'
          new = '    ULONG screen_palette[3 * 256];\n    struct ColorMap *cm;\n    struct RastPort *rp;\n    int index;\n    int screen_pen_count;\n    int draw_w, draw_h;\n'
          if old not in s:
              raise SystemExit('draw locals anchor not found')
          s = s.replace(old, new, 1)

          old = '    rp = window->RPort;\n\n    SetDrMd(rp, JAM1);\n'
          new = '    rp = window->RPort;\n    cm = screen->ViewPort.ColorMap;\n    if (!cm || cm->Count == 0)\n        return;\n\n    screen_pen_count = (int)cm->Count;\n    if (screen_pen_count > 256)\n        screen_pen_count = 256;\n    GetRGB32(cm, 0, (ULONG)screen_pen_count, screen_palette);\n\n    SetDrMd(rp, JAM1);\n'
          if old not in s:
              raise SystemExit('RastPort anchor not found')
          s = s.replace(old, new, 1)

          old = '            LONG pen = mp_sides_hint_pen(pens, &pen_count, r, g, b);\n\n            if (pen != last_pen) {\n                SetAPen(rp, (UBYTE)pen);\n                last_pen = pen;\n            }\n'
          new = '            UBYTE pen = mp_sides_hint_nearest_pen(screen_palette,\n                                                   screen_pen_count,\n                                                   r, g, b);\n\n            if ((LONG)pen != last_pen) {\n                SetAPen(rp, pen);\n                last_pen = (LONG)pen;\n            }\n'
          if old not in s:
              raise SystemExit('pixel pen mapping anchor not found')
          s = s.replace(old, new, 1)

          s = re.sub(r'\n    for \(x = 0; x < pen_count; \+\+x\)\n        ReleasePen\(screen->ViewPort\.ColorMap, \(ULONG\)pens\[x\]\.pen\);\n', '\n', s, count=1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'mp_sides_hint_nearest_pen' src/MintPrintSettings.c
          grep -q 'GetRGB32(cm, 0' src/MintPrintSettings.c
          if grep -q 'mp_sides_hint_pen(pens' src/MintPrintSettings.c; then
            echo 'Old hint pen allocator still present'
            exit 1
          fi
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c
          git commit -m 'Map duplex hints to existing Workbench palette [duplex-palette-fixed]'
          git push origin HEAD:claude/ink-toner-status-panel
