name: Apply output regression suite

on:
  push:
    branches:
      - feature/output-regression-suite
    paths:
      - .github/workflows/apply-output-suite.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/output-regression-suite
      - name: Adjust patcher for current main
        run: python3 .github/fix-output-suite-patcher.py
      - name: Apply regression suite source patch
        run: python3 .github/apply-output-suite.py
      - name: Commit source changes and remove helpers
        run: |
          rm .github/apply-output-suite.py .github/fix-output-suite-patcher.py .github/workflows/apply-output-suite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add capture-only output regression suite"
          git push origin HEAD:feature/output-regression-suite
