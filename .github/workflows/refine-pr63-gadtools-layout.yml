name: Refine PR63 GadTools layout

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  refine-layout:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[uniform-layout-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Apply uniform GadTools geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/MintPrintSettings.c')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '''    ng.ng_LeftEdge = 48;\n    ng.ng_TopEdge = 4 + topborder;\n    ng.ng_Width = 344;\n    ng.ng_Height = 16;\n    ng.ng_GadgetText = (STRPTR)"Unit:";''',
              '''    ng.ng_LeftEdge = 64;\n    ng.ng_TopEdge = 5 + topborder;\n    ng.ng_Width = 328;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"Unit:";''',
              'Unit geometry')

          replace_once(
              '''    ng.ng_LeftEdge = 400;\n    ng.ng_Width = 92;\n    ng.ng_Height = 14;\n    ng.ng_TopEdge = 5 + topborder;\n    ng.ng_GadgetText = (STRPTR)"_Activate";''',
              '''    ng.ng_LeftEdge = 400;\n    ng.ng_Width = 92;\n    ng.ng_Height = 12;\n    ng.ng_TopEdge = 5 + topborder;\n    ng.ng_GadgetText = (STRPTR)"_Activate";''',
              'Activate geometry')

          replace_once(
              '''    ng.ng_LeftEdge = 128;\n    ng.ng_TopEdge = 24 + topborder;\n    ng.ng_Width = 128;\n    ng.ng_Height = 16;\n    ng.ng_GadgetText = (STRPTR)"_Printer IP/Host:";''',
              '''    ng.ng_LeftEdge = 144;\n    ng.ng_TopEdge = 25 + topborder;\n    ng.ng_Width = 144;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"_Printer IP/Host:";''',
              'IP geometry')

          replace_once(
              '''    ng.ng_LeftEdge = 400;\n    ng.ng_Width = 92;\n    ng.ng_Height = 14;\n    ng.ng_TopEdge = 44 + topborder;\n    ng.ng_GadgetText = (STRPTR)"_Query";''',
              '''    ng.ng_LeftEdge = 400;\n    ng.ng_Width = 92;\n    ng.ng_Height = 12;\n    ng.ng_TopEdge = 45 + topborder;\n    ng.ng_GadgetText = (STRPTR)"_Query";''',
              'Query geometry')

          replace_once(
              '''    ng.ng_LeftEdge = 128;\n    ng.ng_TopEdge = 44 + topborder;\n    ng.ng_Width = 264;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"Printer Model:";''',
              '''    ng.ng_LeftEdge = 128;\n    ng.ng_TopEdge = 45 + topborder;\n    ng.ng_Width = 264;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"Printer Model:";''',
              'Model row alignment')

          replace_once(
              '''        ng.ng_LeftEdge = 400;\n        ng.ng_TopEdge = 24 + topborder;\n        ng.ng_Width = 92;\n        ng.ng_Height = 14;\n        ng.ng_GadgetText = (STRPTR)"_Discover";''',
              '''        ng.ng_LeftEdge = 400;\n        ng.ng_TopEdge = 25 + topborder;\n        ng.ng_Width = 92;\n        ng.ng_Height = 12;\n        ng.ng_GadgetText = (STRPTR)"_Discover";''',
              'Discover geometry')

          replace_once(
              '''    ng.ng_LeftEdge = 348;\n    ng.ng_Width = 100;\n    ng.ng_Height = 12;\n    ng.ng_TopEdge = 168 + topborder;\n    ng.ng_GadgetText = (STRPTR)"DPI:";''',
              '''    ng.ng_LeftEdge = 348;\n    ng.ng_Width = 100;\n    ng.ng_Height = 12;\n    ng.ng_TopEdge = 165 + topborder;\n    ng.ng_GadgetText = (STRPTR)"DPI:";''',
              'DPI row alignment')

          replace_once(
              '''    ng.ng_LeftEdge = 304;\n    ng.ng_Width = 90;\n    ng.ng_TopEdge = 216 + topborder;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"_Save";''',
              '''    ng.ng_LeftEdge = 304;\n    ng.ng_Width = 90;\n    ng.ng_TopEdge = 215 + topborder;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"_Save";''',
              'Save row alignment')

          replace_once(
              '''    ng.ng_LeftEdge = 408;\n    ng.ng_Width = 90;\n    ng.ng_TopEdge = 216 + topborder;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"_Exit";''',
              '''    ng.ng_LeftEdge = 408;\n    ng.ng_Width = 90;\n    ng.ng_TopEdge = 215 + topborder;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"_Exit";''',
              'Exit row alignment')

          path.write_text(s, encoding='utf-8')
          PY

          git diff --check

          # Geometry sanity checks for the 520px compact layout.
          grep -q 'ng.ng_LeftEdge = 64;' src/MintPrintSettings.c
          grep -q 'ng.ng_LeftEdge = 144;' src/MintPrintSettings.c
          grep -q 'ng.ng_TopEdge = 165 + topborder;' src/MintPrintSettings.c

      - name: Commit refined layout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No geometry changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c
          git commit -m "Refine compact GadTools alignment [uniform-layout-applied]"
          git push origin HEAD:claude/ink-toner-status-panel
