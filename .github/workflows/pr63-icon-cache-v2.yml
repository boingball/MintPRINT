name: PR63 printer artwork cache v2

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Apply processed printer artwork cache
        shell: bash
        run: |
          set -euo pipefail

          # The main patch script's activation-copy anchor was too broad.
          # Remove only that one section in the temporary checkout, run the
          # rest of the patch, then add the activation copy with a tiny anchor.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/pr63_icon_cache_patch.py')
          s = p.read_text(encoding='utf-8')
          a = s.index('# 6) Activating another Unit copies its artwork cache too, just like capabilities.')
          b = s.index('# 7) Final tiny layout alignment requested from the latest screenshot.')
          p.write_text(s[:a] + '# 6) activation cache copy applied separately by workflow\n\n' + s[b:], encoding='utf-8')
          PY

          python3 .github/pr63_icon_cache_patch.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/MintPrintSettings.c')
          s = p.read_text(encoding='utf-8')
          anchor = '                                    mp_copy_file((CONST_STRPTR)src_cache_envarc, (CONST_STRPTR)dst_cache_envarc);\n'
          if s.count(anchor) != 1:
              raise SystemExit(f'activation artwork anchor count={s.count(anchor)}')
          lines = [
              '',
              '                                    /* Carry the processed printer artwork too. */',
              '                                    {',
              '                                        char src_icon_env[96], src_icon_envarc[96];',
              '                                        char dst_icon_env[96], dst_icon_envarc[96];',
              '                                        ensure_config_dir((CONST_STRPTR)"ENV:MintPRINT/Art");',
              '                                        ensure_config_dir((CONST_STRPTR)"ENVARC:MintPRINT/Art");',
              '                                        unit_icon_cache_path(current_unit_index, FALSE, src_icon_env, sizeof(src_icon_env));',
              '                                        unit_icon_cache_path(current_unit_index, TRUE, src_icon_envarc, sizeof(src_icon_envarc));',
              '                                        unit_icon_cache_path(0, FALSE, dst_icon_env, sizeof(dst_icon_env));',
              '                                        unit_icon_cache_path(0, TRUE, dst_icon_envarc, sizeof(dst_icon_envarc));',
              '                                        mp_copy_file((CONST_STRPTR)src_icon_env, (CONST_STRPTR)dst_icon_env);',
              '                                        mp_copy_file((CONST_STRPTR)src_icon_envarc, (CONST_STRPTR)dst_icon_envarc);',
              '                                    }',
          ]
          insertion = anchor + '\n'.join(lines) + '\n'
          p.write_text(s.replace(anchor, insertion, 1), encoding='utf-8')
          PY

          grep -q 'ENV:MintPRINT/Art/Unit%d.mpic' src/MintPrintSettings.c
          grep -q 'mp_load_printer_icon_cache(TRUE)' src/MintPrintSettings.c
          grep -q 'mp_save_printer_icon_cache' src/MintPrintSettings.c
          grep -q 'ng.ng_LeftEdge = 130;' src/MintPrintSettings.c
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MintPrintSettings.c
          git commit -m 'Cache processed printer artwork per Unit'
          git push origin HEAD:claude/ink-toner-status-panel
