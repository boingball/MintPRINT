name: PR63 compact vertical layout

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[compact-height-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Tighten MintPrint Settings geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/MintPrintSettings.c')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('#define OUTPUT_TOP     265 // Below Test Print / Save / Exit row',
               '#define OUTPUT_TOP     228 // Below Test Print / Save / Exit row'),
              ('#define MP_MARKER_AREA_TOP       65', '#define MP_MARKER_AREA_TOP       57'),
              ('#define MP_MARKER_AREA_BOTTOM   123', '#define MP_MARKER_AREA_BOTTOM   115'),

              ('ng.ng_TopEdge = 5 + topborder;', 'ng.ng_TopEdge = 3 + topborder;'),
              ('ng.ng_TopEdge = 25 + topborder;', 'ng.ng_TopEdge = 21 + topborder;'),
              ('ng.ng_TopEdge = 45 + topborder;', 'ng.ng_TopEdge = 39 + topborder;'),
              ('ng.ng_TopEdge = 65 + topborder;', 'ng.ng_TopEdge = 57 + topborder;'),
              ('ng.ng_TopEdge = 88 + topborder;', 'ng.ng_TopEdge = 78 + topborder;'),
              ('ng.ng_TopEdge = 105 + topborder;', 'ng.ng_TopEdge = 95 + topborder;'),
              ('ng.ng_TopEdge = 125 + topborder;', 'ng.ng_TopEdge = 117 + topborder;'),
              ('ng.ng_TopEdge = 145 + topborder;', 'ng.ng_TopEdge = 135 + topborder;'),
              ('ng.ng_TopEdge = 165 + topborder;', 'ng.ng_TopEdge = 153 + topborder;'),
              ('ng.ng_TopEdge = 185 + topborder;', 'ng.ng_TopEdge = 171 + topborder;'),
              ('ng.ng_TopEdge = 215 + topborder;', 'ng.ng_TopEdge = 198 + topborder;'),

              ('ng.ng_Width = 144;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"_Printer IP/Host:";',
               'ng.ng_Width = 248;\n    ng.ng_Height = 12;\n    ng.ng_GadgetText = (STRPTR)"_Printer IP/Host:";'),

              ('WA_InnerHeight, 350,', 'WA_InnerHeight, 312,'),
              ('WA_MinHeight, 350,', 'WA_MinHeight, 312,'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected text not found: ' + old.splitlines()[0])
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q '#define OUTPUT_TOP     228' src/MintPrintSettings.c
          grep -q '#define MP_MARKER_AREA_TOP       57' src/MintPrintSettings.c
          grep -q '#define MP_MARKER_AREA_BOTTOM   115' src/MintPrintSettings.c
          grep -q 'ng.ng_Width = 248;' src/MintPrintSettings.c
          grep -q 'WA_InnerHeight, 312,' src/MintPrintSettings.c
          grep -q 'WA_MinHeight, 312,' src/MintPrintSettings.c
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c
          git commit -m 'Tighten settings window geometry [compact-height-applied]'
          git push origin HEAD:claude/ink-toner-status-panel
