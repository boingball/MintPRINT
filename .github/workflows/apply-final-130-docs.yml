name: Apply final 1.3.0 docs
on:
  push:
    branches:
      - docs/finalize-1.3.0-release
    paths:
      - .github/workflows/apply-final-130-docs.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/finalize-1.3.0-release
      - name: Finalize release documentation
        run: python .github/finalize_130_docs.py
      - name: Commit documentation and remove helpers
        run: |
          rm .github/workflows/apply-final-130-docs.yml
          rm .github/finalize_130_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md Aminet/MintPRINT.readme docs/MintPrintSettings.guide .github/workflows/apply-final-130-docs.yml .github/finalize_130_docs.py
          git commit -m "Finalize 1.3.0 release documentation"
          git push
