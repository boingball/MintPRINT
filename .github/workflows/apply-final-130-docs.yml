name: Apply final 1.3.0 docs
on:
  push:
    branches:
      - docs/finalize-1.3.0-release
    paths:
      - .github/workflows/apply-final-130-docs.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/finalize-1.3.0-release
      - name: Finalize release documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}")
              p.write_text(text.replace(old, new, 1))

          # Aminet feature list: advertise real duplex, but never the internal QA button.
          replace_once(
              "Aminet/MintPRINT.readme",
              "  - Plain-text printing through PRT:/CMD_WRITE\n  - Prints using JPEG, PostScript, PWG Raster, Apple Raster (URF), or PDF,\n",
              "  - Plain-text printing through PRT:/CMD_WRITE\n  - Capability-gated duplex printing with PWG Raster and Apple Raster (URF),\n    including PWG duplex for PRT:/CMD_WRITE text jobs\n  - Prints using JPEG, PostScript, PWG Raster, Apple Raster (URF), or PDF,\n",
          )
          replace_once(
              "Aminet/MintPRINT.readme",
              "JPEG/PostScript/PWG Raster/PDF output code is shared with the newer driver\nbuild.\n",
              "JPEG/PostScript/PWG Raster/PDF/URF output code is shared with the newer\ndriver build.\n",
          )
          old_aminet = """What's new in 1.3.0
-------------------

  - Optional HDD spooling and retained jobs: status, retry, reprint, copies,
    printer reassignment and delete through View Spooler.
  - AmigaOS 2.04/2.1-compatible GUI and automatic classic-driver selection.
  - Improved strip printing across all engines, including FinalWriter 97
    variable-width bands in driver 41.12. Its retained-job render test
    passed; physical FinalWriter output remains to be confirmed.
  - Improved low-colour/RTG artwork and an AmigaGuide viewer fallback for
    help on AmigaOS 2.x. Supplied Workbench icon uses a 256 KiB stack.
"""
          new_aminet = """What's new in 1.3.0
-------------------

  - Final driver revision 41.16.
  - Optional HDD spooling and retained jobs: status, retry, reprint, copies,
    printer reassignment and delete through View Spooler.
  - AmigaOS 2.04/2.1-compatible GUI and automatic classic-driver selection;
    the classic path completed the full 33-case output capture matrix under
    AmigaOS 2.1 emulation across all five engines, 300/600 DPI, mono/colour
    and PWG/URF duplex.
  - Real duplex output for PWG Raster and Apple Raster (URF), plus PWG duplex
    for PRT:/CMD_WRITE text printing.
  - Improved strip/page-boundary handling across all engines for WordWorth 7
    and Final Writer 97, including variable-width bands and processed FF/reset.
  - mDNS discovery now honours DNS-SD SRV/TXT endpoint metadata, including the
    printer's advertised port and rp= resource path, instead of only guessing
    the common 631 /ipp/print endpoint.
  - Stricter Apple Raster headers use canonical duplex and quality values;
    PWG/URF also offer an explicit 300* compatibility option when 300 DPI is
    not advertised by the printer.
  - JPEG, PDF and PostScript embedded JPEG metadata now records the actual
    selected 300/600 DPI instead of always claiming 300 DPI.
  - Improved low-colour/RTG artwork and an AmigaGuide viewer fallback for
    help on AmigaOS 2.x. Supplied Workbench icon uses a 256 KiB stack.
"""
          replace_once("Aminet/MintPRINT.readme", old_aminet, new_aminet)

          # GitHub front page: concise user-facing summary only.
          old_readme = """## What's new in 1.3.0

- **HDD spooler and job management:** retain jobs, check status, retry,
  reprint, change copies or printer, and delete jobs from **View Spooler**.
- **AmigaOS 2.04/2.1 support:** the same settings GUI and automatic driver
  selection now support older systems alongside AmigaOS 3.x.
- **Strip-printing improvements:** JPEG, PDF and PostScript page buffering,
  plus FinalWriter 97 variable-width bands in driver **41.12**. FinalWriter's
  retained-job render test passed; physical output remains to be confirmed.
- **Workbench artwork and help fixes:** readable artwork on low-colour
  screens, smoother RTG rendering, and an AmigaGuide viewer fallback on OS 2.x.
"""
          new_readme = """## What's new in 1.3.0

- **Final driver revision 41.16.**
- **HDD spooler and job management:** retain jobs, check status, retry,
  reprint, change copies or printer, and delete jobs from **View Spooler**.
- **AmigaOS 2.04/2.1 support:** the same settings GUI and automatic classic
  driver selection now support older systems alongside AmigaOS 3.x; the
  classic path completed the full 33-case output capture matrix on OS 2.1
  emulation across all five engines, 300/600 DPI, mono/colour and duplex.
- **Duplex printing:** PWG Raster and Apple Raster (URF) support real
  multi-page duplex documents; PWG also supports duplex `PRT:`/`CMD_WRITE`
  text output.
- **Application compatibility:** improved strip/page-boundary handling for
  WordWorth 7 and Final Writer 97 across all five engines.
- **Discovery and printer compatibility:** mDNS now uses advertised DNS-SD
  port/path metadata; Apple Raster headers use canonical duplex/quality values;
  PWG/URF can expose an explicit `300* dpi` compatibility option.
- **Output correctness:** JPEG metadata, including JPEGs embedded in PDF and
  PostScript, now records the actual selected 300/600 DPI.
- **Workbench artwork and help fixes:** readable artwork on low-colour
  screens, smoother RTG rendering, and an AmigaGuide viewer fallback on OS 2.x.
"""
          replace_once("README.md", old_readme, new_readme)

          # AmigaGuide: document endpoint-aware mDNS discovery, no QA controls.
          replace_once(
              "docs/MintPrintSettings.guide",
              "@$VER: MintPrintSettings.guide 1.3.0 (30.08.2026)",
              "@$VER: MintPrintSettings.guide 1.3.0 (02.09.2026)",
          )
          replace_once(
              "docs/MintPrintSettings.guide",
              "    - mDNS: a DNS query for \"_ipp._tcp.local\", which is how most current\n      IPP/AirPrint printers actually advertise themselves.\n\nAny address that replies to either scan appears in a small selection\n",
              "    - mDNS: a DNS query for \"_ipp._tcp.local\", which is how most current\n      IPP/AirPrint printers actually advertise themselves. MintPRINT also\n      reads the service's DNS-SD SRV/TXT records so an advertised IPP port\n      and rp= resource path are used instead of blindly assuming 631 and\n      /ipp/print.\n\nAny address that replies to either scan appears in a small selection\n",
          )

          # CHANGELOG: 1.3.0 is now the release; move all final work under it.
          p = Path("CHANGELOG.md")
          text = p.read_text()
          start = text.index("## Unreleased\n")
          end = text.index("## 1.2.7\n")
          final_130 = """## Unreleased

_No unreleased changes._

## 1.3.0

MintPRINT 1.3.0 is the spooler, duplex and classic-OS compatibility milestone.
The GUI now runs on AmigaOS 2.04-era systems as well as later releases,
retained jobs can be managed from the new Spooler window, and the final driver
revision is **41.16**.

- **Disk-backed spooler management.** Choose RAM/T: for the traditional
  behaviour, or a mounted hard drive for a hidden `MPSPOOL` directory. Enable
  **Keep Jobs (HDD)** to retain completed and failed jobs with unique names,
  live status sidecars, retry, reprint, copies, delete and printer
  reassignment from **View Spooler**.
- **Lower memory requirement with HDD spooling.** With RAM/T: spooling, allow
  roughly 2 MB of free RAM for a full-page print. Moving the rendered document
  to an HDD can make a 1 MB system practical, although the GUI, row buffer,
  encoder scratch and TCP/IP stack still require contiguous memory. Retained
  spool storage is limited by free HDD space and normal filesystem file-size
  limits, not by RAM.
- **AmigaOS 2.x compatibility.** The classic pre-V44 build and settings GUI
  now use the older library interface required by AmigaOS 2.04/2.1-era
  systems. The classic driver remains the correct choice through AmigaOS 3.1;
  V44+ systems use the extended build. The final 41.16 classic path completed
  the 33-case capture matrix under AmigaOS 2.1 emulation across all five
  engines, 300/600 DPI, mono/colour and PWG/URF duplex.
- **Real duplex PWG/URF graphics output.** Duplex-capable printers can receive
  one multi-page PWG Raster or Apple Raster document per Print-Job, with PWG
  backside transform handling and canonical URF duplex mode values.
- **`PRT:`/CLI text duplex.** PWG Raster text printing now accumulates a real
  multi-page document and submits the configured long/short-edge `sides=`
  value instead of emitting separate one-sided jobs.
- **Strip-printing page buffering across all engines.** JPEG, PDF and
  PostScript buffer `SPECIAL_NOFORMFEED` bands until the complete page height
  is known; PWG Raster and Apple Raster retain their accumulation paths.
  FinalWriter 97 variable-width bands use a stable page canvas, while
  WordWorth 7's fixed-width path remains protected by regressions.
- **Graphics form-feed/reset boundaries (driver 41.13).** A processed form-feed
  or `aRIS` reset finalizes a pending graphics page before the next one begins,
  preventing short strip-printed pages from absorbing the following page.
- **Strict Apple Raster headers (driver 41.14).** URF uses the canonical
  simplex/short-edge/long-edge values `1/2/3` and Draft/Normal/High quality
  values `3/4/5`. PWG/URF also expose the explicit, never-auto-selected
  `300* dpi` compatibility override when 300 DPI is not advertised.
- **Improved mDNS endpoint discovery.** DNS-SD PTR/SRV/TXT metadata is parsed
  so the advertised IPP port and TXT `rp=` resource path are retained instead
  of always guessing port 631 and `/ipp/print`; conservative fallbacks remain.
- **JPEG density metadata corrected (driver 41.16).** Raw JPEG and embedded
  JPEG streams in PDF/PostScript now write the actual selected 300/600 DPI in
  JFIF density fields instead of always claiming 300 DPI.
- **Test Print placement/reporting fixes.** The built-in full-page test no
  longer adds redundant printer.device centring when Media is Auto, and its
  completion text no longer claims confirmed delivery merely because
  printer.device returned zero.
- **Older Workbench graphics improved.** Printer and duplex artwork remains
  readable on constrained low-colour screens, while RTG/high-depth screens
  avoid unnecessary planar dithering.
- **Workbench launch stack increased to 256 KiB** for discovery, printer
  selection and OS 2.x use. Use the supplied application icon.
- **Help viewer fallback for AmigaOS 2.x.** Help uses MultiView when installed,
  otherwise the standalone AmigaGuide viewer, and reports missing viewers or
  guide files instead of silently failing.
- **Internal release QA.** A developer-only capture regression facility was
  added during 1.3.0 validation. It is hidden from ordinary `make release`
  builds; `make releasetest` stages the separate QA build. The final matrix is
  33 cases and uses OS2-safe short filenames plus byte-exact IPP sidecars.

"""
          p.write_text(text[:start] + final_130 + text[end:])

          # Basic release-doc assertions.
          assert "The driver revision is **41.12**" not in Path("CHANGELOG.md").read_text()
          assert "driver **41.12**" not in Path("README.md").read_text()
          assert "Test Suite" not in Path("Aminet/MintPRINT.readme").read_text()
          assert "Test Suite" not in Path("docs/MintPrintSettings.guide").read_text()
      - name: Commit documentation and remove helper workflow
        run: |
          rm .github/workflows/apply-final-130-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md Aminet/MintPRINT.readme docs/MintPrintSettings.guide .github/workflows/apply-final-130-docs.yml
          git commit -m "Finalize 1.3.0 release documentation"
          git push
