name: Apply PR86 MintPrintSettings link fix
on:
  push:
    branches:
      - fix/test-suite-followup
    paths:
      - .github/workflows/apply-pr86-buildfix.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply build fix
        run: python3 .github/pr86_buildfix.py
      - name: Commit source fix and remove helper
        run: |
          rm .github/pr86_buildfix.py .github/workflows/apply-pr86-buildfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix MintPrintSettings regression-suite link"
          git push
