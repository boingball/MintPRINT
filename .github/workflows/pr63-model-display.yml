name: PR63 printer model read-only text

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[model-text-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Convert printer model to TEXT_KIND
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/MintPrintSettings.c')
          s = p.read_text(encoding='utf-8')

          old = '''    gad = CreateGadget(STRING_KIND, gad, &ng,
        GTST_String, (ULONG)printer_make_model,
        GTST_MaxChars, sizeof(printer_make_model) - 1,
        GA_Disabled, TRUE,
        TAG_DONE);'''
          new = '''    gad = CreateGadget(TEXT_KIND, gad, &ng,
        GTTX_Text, (ULONG)printer_make_model,
        GTTX_Justification, GTJ_LEFT,
        TAG_DONE);'''
          if old not in s:
              raise SystemExit('printer model CreateGadget block not found')
          s = s.replace(old, new, 1)

          old_set = '''        GT_SetGadgetAttrs(g, win, NULL,
                          GTST_String, (ULONG)printer_make_model,
                          TAG_DONE);'''
          new_set = '''        GT_SetGadgetAttrs(g, win, NULL,
                          GTTX_Text, (ULONG)printer_make_model,
                          TAG_DONE);'''
          if old_set not in s:
              raise SystemExit('cached model update block not found')
          s = s.replace(old_set, new_set, 1)

          old_query = '''            GT_SetGadgetAttrs(model_gadget, window, NULL,
                              GTST_String, (ULONG)printer_make_model,
                              TAG_DONE);'''
          new_query = '''            GT_SetGadgetAttrs(model_gadget, window, NULL,
                              GTTX_Text, (ULONG)printer_make_model,
                              TAG_DONE);'''
          if old_query not in s:
              raise SystemExit('query model update block not found')
          s = s.replace(old_query, new_query, 1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'CreateGadget(TEXT_KIND, gad, &ng' src/MintPrintSettings.c
          grep -q 'GTTX_Text, (ULONG)printer_make_model' src/MintPrintSettings.c
          ! grep -A8 'GAD_MODEL_DISPLAY' src/MintPrintSettings.c | grep -q 'GA_Disabled, TRUE'
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c
          git commit -m 'Show printer model as read-only text [model-text-applied]'
          git push origin HEAD:claude/ink-toner-status-panel
