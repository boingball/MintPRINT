name: Apply two-page duplex suite fix

on:
  push:
    branches:
      - feature/output-regression-suite
    paths:
      - .github/workflows/patch-suite-duplex.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/output-regression-suite
      - name: Apply duplex regression fixes
        run: python3 .github/patch-suite-duplex.py
      - name: Commit source changes and remove helper
        run: |
          rm .github/patch-suite-duplex.py .github/workflows/patch-suite-duplex.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exercise real two-page duplex captures"
          git push origin HEAD:feature/output-regression-suite
