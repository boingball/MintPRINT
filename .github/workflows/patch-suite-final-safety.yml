name: Apply final Test Suite safety fixes

on:
  push:
    branches:
      - feature/output-regression-suite
    paths:
      - .github/workflows/patch-suite-final-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/output-regression-suite
      - name: Apply safety fixes
        run: python3 .github/patch-suite-final-safety.py
      - name: Commit and remove helper
        run: |
          rm .github/patch-suite-final-safety.py .github/workflows/patch-suite-final-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden output Test Suite state handling"
          git push origin HEAD:feature/output-regression-suite
