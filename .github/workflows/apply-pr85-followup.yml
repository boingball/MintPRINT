name: Apply PR85 regression follow-up

on:
  push:
    branches:
      - fix/test-suite-followup
    paths:
      - .github/pr85_followup_patch.py
      - .github/workflows/apply-pr85-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-suite-followup
          fetch-depth: 0
      - name: Apply follow-up patch
        run: python3 .github/pr85_followup_patch.py
      - name: Commit source changes and remove helper
        run: |
          rm -f .github/pr85_followup_patch.py .github/workflows/apply-pr85-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix regression suite findings and JPEG DPI metadata"
          git push origin HEAD:fix/test-suite-followup
