name: PR63 printer icon

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[printer-icon-added]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Add IPP printer icon preview
        shell: bash
        run: |
          python3 .github/pr63_printer_icon_patch.py
          grep -q '"printer-icons"' src/MintPrintSettings.c
          grep -q 'mp_refresh_printer_icon' src/MintPrintSettings.c
          grep -q 'MP_PRINTER_ICON_LEFT  420' src/MintPrintSettings.c
          grep -q 'graphics/scale.h' src/MintPrintSettings.c
          grep -q '"printer-icons"' windows_ipp_probe.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c windows_ipp_probe.py
          git commit -m 'Show IPP printer icon beside duplex hint [printer-icon-added]'
          git push origin HEAD:claude/ink-toner-status-panel
