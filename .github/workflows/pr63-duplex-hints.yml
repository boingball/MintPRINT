name: PR63 duplex hint images

on:
  push:
    branches:
      - claude/ink-toner-status-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[duplex-hints-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ink-toner-status-panel
          fetch-depth: 0

      - name: Add duplex hint image panel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/MintPrintSettings.c')
          s = p.read_text(encoding='utf-8')

          # Forward declaration: reload/query/event code lives before the
          # image loader and drawing implementation below.
          anchor = 'static void mp_draw_marker_strips(void);\n'
          if anchor not in s:
              raise SystemExit('marker forward declaration not found')
          s = s.replace(anchor,
              anchor + 'static void mp_draw_sides_hint(void);\n', 1)

          # Add the small runtime IFF cache/drawer immediately after the
          # existing ILBM->RGB helper so it can reuse the same loader format.
          anchor = '''    free_jpeg_data(&data);\n    return 0;\n}\n\n// Creates a valid PWG header and uncompressed RGB data\n'''
          if anchor not in s:
              raise SystemExit('load_ilbm_to_rgb end anchor not found')

          block = r'''    free_jpeg_data(&data);
    return 0;
}

/* ---------------------------------------------------------------------
 * Duplex visual hint.
 *
 * The 32x32 ILBM files live next to the application in PROGDIR:Art/ and
 * are staged there by the release targets in the Makefile.  Keeping them
 * external makes them easy to replace without rebuilding MintPrintSettings
 * and reuses the ILBM decoder already linked into this program.
 *
 * This is intentionally hand-drawn into spare space rather than another
 * GadTools gadget: it is purely an explanatory picture for the Sides cycle.
 * ------------------------------------------------------------------ */
#define MP_SIDES_HINT_LEFT       460
#define MP_SIDES_HINT_TOP        117
#define MP_SIDES_HINT_SIZE        32
#define MP_SIDES_HINT_MAX_PENS    32
#define MP_SIDES_HINT_COUNT        3

struct MPSidesHintImage {
    unsigned char *rgb;
    int width;
    int height;
    BOOL attempted;
};

struct MPSidesHintPen {
    UBYTE r, g, b;
    LONG pen;
};

static struct MPSidesHintImage mp_sides_hint_images[MP_SIDES_HINT_COUNT];
static const char *mp_sides_hint_paths[MP_SIDES_HINT_COUNT] = {
    "PROGDIR:Art/single.iff",
    "PROGDIR:Art/longside.iff",
    "PROGDIR:Art/shortside.iff"
};

static int mp_sides_hint_index(void) {
    if (strcmp(driver_sides_buffer, "two-sided-long-edge") == 0)
        return 1;
    if (strcmp(driver_sides_buffer, "two-sided-short-edge") == 0)
        return 2;
    return 0;
}

static BOOL mp_load_sides_hint_image(int index) {
    struct MPSidesHintImage *image;
    struct jpeg_data data;
    int pixels;
    int i;

    if (index < 0 || index >= MP_SIDES_HINT_COUNT)
        return FALSE;

    image = &mp_sides_hint_images[index];
    if (image->attempted)
        return image->rgb != NULL;

    image->attempted = TRUE;
    memset(&data, 0, sizeof(data));

    /* Do not use load_ilbm_to_rgb() here: that helper logs its progress to
     * the GUI status box, while these tiny UI assets should load silently. */
    if (load_iff_direct(mp_sides_hint_paths[index], &data) != 0)
        return FALSE;

    if (data.width <= 0 || data.height <= 0 ||
        data.width > 64 || data.height > 64) {
        free_jpeg_data(&data);
        return FALSE;
    }

    pixels = data.width * data.height;
    image->rgb = AllocVec((ULONG)pixels * 3UL, MEMF_ANY);
    if (!image->rgb) {
        free_jpeg_data(&data);
        return FALSE;
    }

    for (i = 0; i < pixels; ++i) {
        image->rgb[i * 3 + 0] = data.red[i];
        image->rgb[i * 3 + 1] = data.green[i];
        image->rgb[i * 3 + 2] = data.blue[i];
    }
    image->width = data.width;
    image->height = data.height;
    free_jpeg_data(&data);
    return TRUE;
}

static LONG mp_sides_hint_pen(struct MPSidesHintPen *pens, int *count,
                              UBYTE r, UBYTE g, UBYTE b) {
    int i;
    int best = -1;
    ULONG best_distance = 0xffffffffUL;

    /* The source artwork may contain far more colours than a classic
     * Workbench screen. Quantise before caching, then let graphics.library
     * choose the nearest available screen pen. */
    r = (UBYTE)(r & 0xe0);
    g = (UBYTE)(g & 0xe0);
    b = (UBYTE)(b & 0xe0);

    for (i = 0; i < *count; ++i) {
        if (pens[i].r == r && pens[i].g == g && pens[i].b == b)
            return pens[i].pen;
    }

    if (*count < MP_SIDES_HINT_MAX_PENS) {
        LONG pen = (LONG)ObtainBestPenA(screen->ViewPort.ColorMap,
                                       (ULONG)r << 24,
                                       (ULONG)g << 24,
                                       (ULONG)b << 24,
                                       NULL);
        if (pen >= 0) {
            pens[*count].r = r;
            pens[*count].g = g;
            pens[*count].b = b;
            pens[*count].pen = pen;
            ++(*count);
            return pen;
        }
    }

    /* If the screen cannot spare another pen, use the closest colour we
     * already obtained for this draw rather than failing the whole icon. */
    for (i = 0; i < *count; ++i) {
        LONG dr = (LONG)r - (LONG)pens[i].r;
        LONG dg = (LONG)g - (LONG)pens[i].g;
        LONG db = (LONG)b - (LONG)pens[i].b;
        ULONG distance = (ULONG)(dr * dr + dg * dg + db * db);
        if (best < 0 || distance < best_distance) {
            best = i;
            best_distance = distance;
        }
    }

    return best >= 0 ? pens[best].pen : 1;
}

static void mp_draw_sides_hint(void) {
    struct MPSidesHintImage *image;
    struct MPSidesHintPen pens[MP_SIDES_HINT_MAX_PENS];
    struct RastPort *rp;
    int index;
    int pen_count = 0;
    int draw_w, draw_h;
    int x, y;
    int left = MP_SIDES_HINT_LEFT;
    int top = g_topborder + MP_SIDES_HINT_TOP;

    if (!window || !screen)
        return;

    rp = window->RPort;

    /* A simple 1px frame makes the 32x32 artwork read as a small image box
     * without stealing any more of the already-tight GadTools layout. */
    SetDrMd(rp, JAM1);
    SetAPen(rp, 0);
    RectFill(rp, left - 1, top - 1,
             left + MP_SIDES_HINT_SIZE, top + MP_SIDES_HINT_SIZE);
    SetAPen(rp, 1);
    RectFill(rp, left - 1, top - 1,
             left + MP_SIDES_HINT_SIZE, top - 1);
    RectFill(rp, left - 1, top - 1,
             left - 1, top + MP_SIDES_HINT_SIZE);
    RectFill(rp, left - 1, top + MP_SIDES_HINT_SIZE,
             left + MP_SIDES_HINT_SIZE, top + MP_SIDES_HINT_SIZE);
    RectFill(rp, left + MP_SIDES_HINT_SIZE, top - 1,
             left + MP_SIDES_HINT_SIZE, top + MP_SIDES_HINT_SIZE);

    index = mp_sides_hint_index();
    if (!mp_load_sides_hint_image(index))
        return; /* Missing Art/ is non-fatal; the Sides cycle still works. */

    image = &mp_sides_hint_images[index];
    draw_w = image->width < MP_SIDES_HINT_SIZE
           ? image->width : MP_SIDES_HINT_SIZE;
    draw_h = image->height < MP_SIDES_HINT_SIZE
           ? image->height : MP_SIDES_HINT_SIZE;

    for (y = 0; y < draw_h; ++y) {
        LONG last_pen = -1;
        for (x = 0; x < draw_w; ++x) {
            int pixel = y * image->width + x;
            UBYTE r = image->rgb[pixel * 3 + 0];
            UBYTE g = image->rgb[pixel * 3 + 1];
            UBYTE b = image->rgb[pixel * 3 + 2];
            LONG pen = mp_sides_hint_pen(pens, &pen_count, r, g, b);

            if (pen != last_pen) {
                SetAPen(rp, (UBYTE)pen);
                last_pen = pen;
            }
            WritePixel(rp, left + x, top + y);
        }
    }

    for (x = 0; x < pen_count; ++x)
        ReleasePen(screen->ViewPort.ColorMap, (ULONG)pens[x].pen);
}

static void mp_free_sides_hint_images(void) {
    int i;
    for (i = 0; i < MP_SIDES_HINT_COUNT; ++i) {
        if (mp_sides_hint_images[i].rgb) {
            FreeVec(mp_sides_hint_images[i].rgb);
            mp_sides_hint_images[i].rgb = NULL;
        }
        mp_sides_hint_images[i].width = 0;
        mp_sides_hint_images[i].height = 0;
        mp_sides_hint_images[i].attempted = FALSE;
    }
}

// Creates a valid PWG header and uncompressed RGB data
'''
          s = s.replace(anchor, block, 1)

          # Unit reload already repaints the hand-drawn ink panel; update the
          # Sides visual at the same point.
          old = '''    GT_RefreshWindow(win, NULL);\n    mp_draw_marker_strips();\n}\n'''
          new = '''    GT_RefreshWindow(win, NULL);\n    mp_draw_marker_strips();\n    mp_draw_sides_hint();\n}\n'''
          if old not in s:
              raise SystemExit('reload_current_unit redraw anchor not found')
          s = s.replace(old, new, 1)

          # Query can change the supported/active Sides value.
          old = '''    mp_draw_marker_strips();\n}\n\nint send_pwg_print_job'''
          new = '''    mp_draw_marker_strips();\n    mp_draw_sides_hint();\n}\n\nint send_pwg_print_job'''
          if old not in s:
              raise SystemExit('perform_query_flow redraw anchor not found')
          s = s.replace(old, new, 1)

          # Engine changes can enable/disable duplex, so repaint after the
          # existing update_sides_dropdown().
          old = '''                                update_sides_dropdown(win);\n                                update_dpi_dropdown(win);\n'''
          new = '''                                update_sides_dropdown(win);\n                                update_dpi_dropdown(win);\n                                mp_draw_sides_hint();\n'''
          if old not in s:
              raise SystemExit('engine change anchor not found')
          s = s.replace(old, new, 1)

          # Add a proper live Sides change handler. This also keeps
          # driver_sides_buffer in sync immediately, rather than only when
          # later code rereads/saves the gadget.
          anchor = '''                        case GAD_RESOLUTION:\n'''
          if anchor not in s:
              raise SystemExit('GAD_RESOLUTION case anchor not found')
          case_block = r'''                        case GAD_SIDES:
                        {
                            ULONG selected = 0;
                            GT_GetGadgetAttrs(gad, win, NULL,
                                              GTCY_Active, (ULONG)&selected,
                                              TAG_DONE);
                            if (selected < (ULONG)mp_sides_option_count) {
                                strncpy(driver_sides_buffer,
                                        mp_sides_value_storage[selected],
                                        sizeof(driver_sides_buffer) - 1);
                                driver_sides_buffer[
                                    sizeof(driver_sides_buffer) - 1] = '\0';
                                printf("Sides set to: %s\n", driver_sides_buffer);
                                mp_draw_sides_hint();
                            }
                        }
                        break;

                        case GAD_RESOLUTION:
'''
          s = s.replace(anchor, case_block, 1)

          # Repaint hand-drawn image on Intuition refresh.
          old = '''                    redraw_output_box();\n                    mp_draw_marker_strips();\n                    break;\n'''
          new = '''                    redraw_output_box();\n                    mp_draw_marker_strips();\n                    mp_draw_sides_hint();\n                    break;\n'''
          if old not in s:
              raise SystemExit('IDCMP refresh redraw anchor not found')
          s = s.replace(old, new, 1)

          # Draw once when the window is first created.
          old = '''    custom_printf("CLEAR");\n    mp_draw_marker_strips();\n\n    // Set the initial state'''
          new = '''    custom_printf("CLEAR");\n    mp_draw_marker_strips();\n    mp_draw_sides_hint();\n\n    // Set the initial state'''
          if old not in s:
              raise SystemExit('initial redraw anchor not found')
          s = s.replace(old, new, 1)

          # The final startup repaint happens after requesters/query work.
          old = '''    redraw_output_box();\n\n    // Process events\n'''
          new = '''    redraw_output_box();\n    mp_draw_marker_strips();\n    mp_draw_sides_hint();\n\n    // Process events\n'''
          if old not in s:
              raise SystemExit('final startup redraw anchor not found')
          s = s.replace(old, new, 1)

          # Free cached RGB copies before closing the window/screen.
          old = '''    /* Correct GadTools teardown order: first detach menus and close the\n'''
          new = '''    mp_free_sides_hint_images();\n\n    /* Correct GadTools teardown order: first detach menus and close the\n'''
          if old not in s:
              raise SystemExit('cleanup anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          # Stage the three ILBM assets inside the application drawer.
          m = Path('Makefile')
          ms = m.read_text(encoding='utf-8')

          old = '''\tcp docs/MintPrintSettings.guide $(RELEASE_DIR)/\n\tcp Aminet/MintPRINT.readme release/MintPRINT.readme\n'''
          new = '''\tcp docs/MintPrintSettings.guide $(RELEASE_DIR)/\n\tmkdir -p $(RELEASE_DIR)/Art\n\tcp $(ART_DIR)/single.iff $(ART_DIR)/longside.iff $(ART_DIR)/shortside.iff $(RELEASE_DIR)/Art/\n\tcp Aminet/MintPRINT.readme release/MintPRINT.readme\n'''
          if old not in ms:
              raise SystemExit('release staging anchor not found')
          ms = ms.replace(old, new, 1)

          old = '''\tcp docs/MintPrintSettings.guide $(RELEASE31_DIR)/\n\tcp Aminet/MintPRINT.readme release/MintPRINT-OS31.readme\n'''
          new = '''\tcp docs/MintPrintSettings.guide $(RELEASE31_DIR)/\n\tmkdir -p $(RELEASE31_DIR)/Art\n\tcp $(ART_DIR)/single.iff $(ART_DIR)/longside.iff $(ART_DIR)/shortside.iff $(RELEASE31_DIR)/Art/\n\tcp Aminet/MintPRINT.readme release/MintPRINT-OS31.readme\n'''
          if old not in ms:
              raise SystemExit('release31 staging anchor not found')
          ms = ms.replace(old, new, 1)

          m.write_text(ms, encoding='utf-8')
          PY

          grep -q 'PROGDIR:Art/single.iff' src/MintPrintSettings.c
          grep -q 'PROGDIR:Art/longside.iff' src/MintPrintSettings.c
          grep -q 'PROGDIR:Art/shortside.iff' src/MintPrintSettings.c
          grep -q 'case GAD_SIDES:' src/MintPrintSettings.c
          grep -q 'mp_draw_sides_hint();' src/MintPrintSettings.c
          grep -q '$(RELEASE_DIR)/Art/' Makefile
          grep -q '$(RELEASE31_DIR)/Art/' Makefile
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MintPrintSettings.c Makefile
          git commit -m 'Show duplex mode hint images [duplex-hints-applied]'
          git push origin HEAD:claude/ink-toner-status-panel
